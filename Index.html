<div id="ui" class="game-active">
  <div class="hud">
    <b>OFF BALANCE</b><br>
    <span>BUILD 01 • SANDBOX</span>
  </div>
  <div class="status" id="status">TAP THE CONTROLS TO RIDE</div>
  <button id="menuBtn" type="button">MENU</button>
  <button id="reset" type="button">RESET</button>
  <div class="controls">
    <div class="group">
      <button class="ctrl big" id="leanLeft" type="button">LEAN<br>LEFT</button>
      <button class="ctrl" id="brake" type="button">BRAKE</button>
    </div>
    <div class="group">
      <button class="ctrl" id="gas" type="button">GAS</button>
      <button class="ctrl big" id="leanRight" type="button">LEAN<br>RIGHT</button>
    </div>
  </div>
</div>
<div id="crash">
  <div class="crashbox">
    <h2>WIPED OUT</h2>
    <p>Resetting bike...</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  try {
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d11);
    scene.fog = new THREE.FogExp2(0x090d11, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, -10);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(20, 40, -20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Ground / Terrain
    const floorGeo = new THREE.PlaneGeometry(500, 500, 64, 64);
    floorGeo.rotateX(-Math.PI / 2);
    const posAttr = floorGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      if (Math.abs(x) > 5) {
        posAttr.setY(i, Math.sin(x * 0.05) * Math.cos(z * 0.05) * 3);
      }
    }
    floorGeo.computeVertexNormals();
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a232a, roughness: 0.8, metalness: 0.2 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.receiveShadow = true;
    scene.add(floor);

    // Simple Motorcycle Model
    const bikeGroup = new THREE.Group();
    scene.add(bikeGroup);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd91f2b, roughness: 0.3, metalness: 0.7 });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x15191c, roughness: 0.5, metalness: 0.8 });
    const rubberMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e6, metalness: 0.9, roughness: 0.1 });

    // Chassis
    const bodyBox = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 2.0), bodyMat);
    bodyBox.position.set(0, 1.0, 0);
    bodyBox.castShadow = true;
    bikeGroup.add(bodyBox);

    // Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 24);
    wheelGeo.rotateZ(Math.PI / 2);

    const frontWheel = new THREE.Mesh(wheelGeo, rubberMat);
    frontWheel.position.set(0, 0.5, 1.2);
    frontWheel.castShadow = true;
    bikeGroup.add(frontWheel);

    const rearWheel = new THREE.Mesh(wheelGeo, rubberMat);
    rearWheel.position.set(0, 0.5, -1.2);
    rearWheel.castShadow = true;
    bikeGroup.add(rearWheel);

    // Game Physics State
    let bikeState = {
      x: 0,
      y: 1.5,
      z: 0,
      speed: 0,
      maxSpeed: 0.8,
      accel: 0.015,
      friction: 0.98,
      turnSpeed: 0.04,
      angle: 0,
      lean: 0,
      maxLean: 0.75,
      crashed: false
    };

    const keys = { gas: false, brake: false, left: false, right: false };

    // Input Wiring
    function bindButton(id, keyName) {
      const btn = document.getElementById(id);
      if (!btn) return;
      const setKey = (val) => {
        keys[keyName] = val;
        if (val) btn.classList.add('active');
        else btn.classList.remove('active');
      };
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); setKey(true); });
      btn.addEventListener('pointerup', (e) => { e.preventDefault(); setKey(false); });
      btn.addEventListener('pointerleave', (e) => { e.preventDefault(); setKey(false); });
    }

    bindButton('gas', 'gas');
    bindButton('brake', 'brake');
    bindButton('leanLeft', 'left');
    bindButton('leanRight', 'right');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    document.getElementById('reset').addEventListener('click', () => {
      bikeState.x = 0;
      bikeState.z = 0;
      bikeState.y = 1.5;
      bikeState.speed = 0;
      bikeState.angle = 0;
      bikeState.lean = 0;
      bikeState.crashed = false;
      document.getElementById('crash').style.display = 'none';
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
      window.location.reload();
    });

    // Main Loop
    function animate() {
      requestAnimationFrame(animate);

      if (!bikeState.crashed) {
        if (keys.gas) bikeState.speed += bikeState.accel;
        if (keys.brake) bikeState.speed -= bikeState.accel * 1.5;

        bikeState.speed *= bikeState.friction;
        bikeState.speed = Math.max(-0.2, Math.min(bikeState.maxSpeed, bikeState.speed));

        if (keys.left) {
          bikeState.angle += bikeState.turnSpeed * (bikeState.speed / bikeState.maxSpeed);
          bikeState.lean -= 0.05;
        } else if (keys.right) {
          bikeState.angle -= bikeState.turnSpeed * (bikeState.speed / bikeState.maxSpeed);
          bikeState.lean += 0.05;
        } else {
          bikeState.lean *= 0.9;
        }

        bikeState.lean = Math.max(-bikeState.maxLean, Math.min(bikeState.maxLean, bikeState.lean));

        // Crash check on extreme lean at speed
        if (Math.abs(bikeState.lean) >= bikeState.maxLean && Math.abs(bikeState.speed) > 0.2) {
          bikeState.crashed = true;
          document.getElementById('crash').style.display = 'flex';
        }

        bikeState.x += Math.sin(bikeState.angle) * bikeState.speed;
        bikeState.z += Math.cos(bikeState.angle) * bikeState.speed;

        bikeGroup.position.set(bikeState.x, bikeState.y, bikeState.z);
        bikeGroup.rotation.y = bikeState.angle;
        bikeGroup.rotation.z = bikeState.lean;

        // Camera follow
        const targetCamPos = new THREE.Vector3(
          bikeState.x - Math.sin(bikeState.angle) * 6,
          bikeState.y + 3,
          bikeState.z - Math.cos(bikeState.angle) * 6
        );
        camera.position.lerp(targetCamPos, 0.1);
        camera.lookAt(bikeState.x, bikeState.y + 1, bikeState.z + Math.cos(bikeState.angle) * 2);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

  } catch (err) {
    console.error("Game engine init error:", err);
  }
})();
                           </script>
